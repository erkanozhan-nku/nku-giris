<!doctype html>
<!-- Surum: v2 | Tarih: 2026-11-24 23:17:17 UTC+3 | Donus adresi: ogrencinin geldigi adres (o=), yalnizca izinli iki adres; yoksa IP -->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer-when-downgrade">
<title>NKÜ Okul Hesabı ile Giriş</title>
<style>
:root{ --bg:#f4f5f7; --card:#fff; --ink:#1d2327; --mut:#666; --line:#e2e4e7; --err:#721c24; --errbg:#f8d7da; --ok:#155724; --okbg:#d4edda; }
@media (prefers-color-scheme: dark){
  :root{ --bg:#16181b; --card:#212429; --ink:#e8eaed; --mut:#a0a4a8; --line:#3a3f45; --err:#f5c2c7; --errbg:#4a2328; --ok:#b7e4c2; --okbg:#1f3a27; }
}
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
.wrap{ max-width:460px; margin:24px auto; padding:0 16px; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px 20px; box-shadow:0 2px 12px rgba(0,0,0,.06); text-align:center; }
h1{ font-size:20px; margin:0 0 10px; }
p{ font-size:14px; color:var(--mut); margin:0 0 18px; }
#gbtn{ display:flex; justify-content:center; min-height:44px; margin:12px 0; }
#msg{ margin-top:14px; font-size:14px; border-radius:8px; padding:0; }
#msg.err{ background:var(--errbg); color:var(--err); padding:12px; }
#msg.ok{ background:var(--okbg); color:var(--ok); padding:12px; }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="wrap"><div class="card">
<h1>NKÜ Okul Hesabı ile Giriş</h1>
<p>Yoklama ve uygulama performansı için <strong>@nku.edu.tr</strong> uzantılı üniversite hesabınızla bir kez giriş yapın. Giriş sonrası sınıf sunucusuna otomatik döneceksiniz.</p>
<div id="gbtn"><span style="color:var(--mut);font-size:14px;">Google girişi yükleniyor…</span></div>
<div id="msg"></div>
</div></div>
<script>
(function () {
  'use strict';
  var CID = "138674582611-9ur27mtchl3qh6imhbi50d46kjqn16uv.apps.googleusercontent.com";
  var HOSTS = { "10.125.16.44": 1, "kampusici.erkanhoca.com": 1 };   // izinli donus adresleri; baska hicbir adrese donulmez
  var msg = document.getElementById('msg');
  var hash = location.hash.replace(/^#/, '');
  var ret = (hash.match(/(?:^|&)ret=([a-z]+)/) || [])[1] || 'att';
  var targetPath = (ret === 'perf') ? '/performans' : '/';
  var from = ((hash.match(/(?:^|&)o=([A-Za-z0-9.-]{1,80})(?:&|$)/) || [])[1] || '').toLowerCase();
  var VENTO = 'http://' + (HOSTS.hasOwnProperty(from) ? from : '10.125.16.44');
  function setMsg(cls, txt) { msg.className = cls; msg.textContent = txt; }
  function parseJwt(t) {
    try {
      var b = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      while (b.length % 4) b += '=';
      return JSON.parse(decodeURIComponent(escape(atob(b))));
    } catch (e) { return null; }
  }
  function onCred(resp) {
    var cred = resp && resp.credential;
    if (!cred) { setMsg('err', 'Google kimliği alınamadı. Tekrar deneyin.'); return; }
    var p = parseJwt(cred);
    var em = (p && p.email) ? String(p.email).toLowerCase() : '';
    if (!em.endsWith('@nku.edu.tr')) {
      setMsg('err', 'Sadece @nku.edu.tr uzantılı okul hesabınızla girebilirsiniz (seçilen: ' + (em || '?') + '). Lütfen tekrar tıklayıp okul hesabınızı seçin.');
      return;
    }
    setMsg('ok', 'Giriş başarılı, sınıf sunucusuna dönülüyor…');
    location.replace(VENTO + targetPath + '#g=' + encodeURIComponent(cred));
  }
  function initGsi(tries) {
    if (!window.google || !google.accounts || !google.accounts.id) {
      if (tries > 50) { setMsg('err', 'Google giriş servisi yüklenemedi. İnternet bağlantınızı kontrol edip yenileyin.'); return; }
      setTimeout(function () { initGsi(tries + 1); }, 150);
      return;
    }
    google.accounts.id.initialize({ client_id: CID, callback: onCred, auto_select: false, ux_mode: 'popup' });
    var box = document.getElementById('gbtn');
    box.innerHTML = '';
    google.accounts.id.renderButton(box, { theme: 'outline', size: 'large', width: 280, text: 'signin_with', locale: 'tr' });
  }
  initGsi(0);
})();
</script>
</body>
</html>
